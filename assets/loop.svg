<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How I work: users, problem, PRD, build, verify, ship, measure, and back to users</title>
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .n{animation:glow 7s linear infinite}
      @keyframes glow{0%,100%{stroke:#2C3A4E}6%{stroke:#C6F432}14%{stroke:#2C3A4E}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#0B0F14"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="18" fill="none" stroke="#243042"/>
  <text x="40" y="44" class="mono" font-size="15" fill="#6B7A90">// the loop I run for every feature</text>

  <path id="p" d="M110 130 H1090 C1150 130 1150 250 1090 250 H110 C50 250 50 130 110 130 Z" fill="none" stroke="#243042" stroke-width="2" stroke-dasharray="6 8"/>

  <g class="sans" font-size="19" font-weight="700" text-anchor="middle" fill="#F2F5F9">
    <g><rect class="n" style="animation-delay:0s" x="50" y="104" width="120" height="52" rx="12" fill="#141B24" stroke-width="2"/><text x="110" y="137">users</text></g>
    <g><rect class="n" style="animation-delay:.9s" x="210" y="104" width="130" height="52" rx="12" fill="#141B24" stroke-width="2"/><text x="275" y="137">problem</text></g>
    <g><rect class="n" style="animation-delay:1.8s" x="380" y="104" width="110" height="52" rx="12" fill="#141B24" stroke-width="2"/><text x="435" y="137" fill="#B69CFF">PRD</text></g>
    <g><rect class="n" style="animation-delay:2.7s" x="530" y="104" width="120" height="52" rx="12" fill="#141B24" stroke-width="2"/><text x="590" y="137" fill="#C6F432">build</text></g>
    <g><rect class="n" style="animation-delay:3.5s" x="690" y="104" width="120" height="52" rx="12" fill="#141B24" stroke-width="2"/><text x="750" y="137" fill="#FFC23D">verify</text></g>
    <g><rect class="n" style="animation-delay:4.3s" x="850" y="104" width="110" height="52" rx="12" fill="#141B24" stroke-width="2"/><text x="905" y="137" fill="#FF6B4A">ship</text></g>
    <g><rect class="n" style="animation-delay:5s" x="1000" y="104" width="140" height="52" rx="12" fill="#141B24" stroke-width="2"/><text x="1070" y="137" fill="#5EE6FF">measure</text></g>
  </g>

  <g class="mono" font-size="14" fill="#6B7A90" text-anchor="middle">
    <text x="275" y="190">calls · Crisp</text>
    <text x="435" y="190">must/nice/won't</text>
    <text x="590" y="190">me + Claude</text>
    <text x="750" y="190">tests · counts</text>
    <text x="1070" y="190">Mixpanel · NPS</text>
    <text x="110" y="190">talk first</text>
    <text x="905" y="190">weekly</text>
    <text x="600" y="276" fill="#AEB9C8">and back to the users, to ask if it actually helped</text>
  </g>

  <circle r="7" fill="#C6F432">
    <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#p"/></animateMotion>
  </circle>
  <circle r="14" fill="#C6F432" opacity=".18">
    <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#p"/></animateMotion>
  </circle>
</svg>

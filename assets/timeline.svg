<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Timeline: Smart India Hackathon 2022 winner, MumbaiHacks 2023 GenAI track winner, SigLens 2024, Psylief 2024, Louper from November 2024 to now</title>
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .in{opacity:0;animation:in .5s ease-out forwards}
      @keyframes in{to{opacity:1}}
      .ring{animation:ring 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    </style>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#2C3A4E"/><stop offset=".7" stop-color="#5EE6FF"/><stop offset="1" stop-color="#C6F432"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="#0B0F14"/>
  <rect x=".5" y=".5" width="1199" height="259" rx="18" fill="none" stroke="#243042"/>
  <text x="40" y="44" class="mono" font-size="15" fill="#6B7A90">// git log --oneline saif</text>

  <rect x="80" y="128" height="4" rx="2" fill="url(#g)" width="0">
    <animate attributeName="width" from="0" to="1040" dur="2.2s" fill="freeze" calcMode="spline" keySplines=".3 .7 .2 1"/>
  </rect>

  <g class="in" style="animation-delay:.2s">
    <circle cx="120" cy="130" r="9" fill="#141B24" stroke="#FFC23D" stroke-width="3"/>
    <text x="120" y="102" class="mono" font-size="14" fill="#6B7A90" text-anchor="middle">2022</text>
    <text x="120" y="170" class="sans" font-size="17" font-weight="700" fill="#F2F5F9" text-anchor="middle">Smart India</text>
    <text x="120" y="192" class="sans" font-size="17" font-weight="700" fill="#F2F5F9" text-anchor="middle">Hackathon</text>
    <text x="120" y="214" class="mono" font-size="13" fill="#FFC23D" text-anchor="middle">winner</text>
  </g>
  <g class="in" style="animation-delay:.6s">
    <circle cx="330" cy="130" r="9" fill="#141B24" stroke="#FFC23D" stroke-width="3"/>
    <text x="330" y="102" class="mono" font-size="14" fill="#6B7A90" text-anchor="middle">2023</text>
    <text x="330" y="170" class="sans" font-size="17" font-weight="700" fill="#F2F5F9" text-anchor="middle">MumbaiHacks</text>
    <text x="330" y="192" class="mono" font-size="13" fill="#FFC23D" text-anchor="middle">GenAI track winner</text>
  </g>
  <g class="in" style="animation-delay:1s">
    <circle cx="540" cy="130" r="9" fill="#141B24" stroke="#5EE6FF" stroke-width="3"/>
    <text x="540" y="102" class="mono" font-size="14" fill="#6B7A90" text-anchor="middle">Jan 2024</text>
    <text x="540" y="170" class="sans" font-size="17" font-weight="700" fill="#F2F5F9" text-anchor="middle">SigLens</text>
    <text x="540" y="192" class="mono" font-size="13" fill="#AEB9C8" text-anchor="middle">open source observability</text>
    <text x="540" y="212" class="mono" font-size="13" fill="#AEB9C8" text-anchor="middle">plain English → log queries</text>
  </g>
  <g class="in" style="animation-delay:1.4s">
    <circle cx="770" cy="130" r="9" fill="#141B24" stroke="#5EE6FF" stroke-width="3"/>
    <text x="770" y="102" class="mono" font-size="14" fill="#6B7A90" text-anchor="middle">May 2024</text>
    <text x="770" y="170" class="sans" font-size="17" font-weight="700" fill="#F2F5F9" text-anchor="middle">Psylief</text>
    <text x="770" y="192" class="mono" font-size="13" fill="#AEB9C8" text-anchor="middle">4-person startup</text>
    <text x="770" y="212" class="mono" font-size="13" fill="#AEB9C8" text-anchor="middle">monolith → microservices</text>
  </g>
  <g class="in" style="animation-delay:1.9s">
    <circle class="ring" cx="1030" cy="130" r="10" fill="none" stroke="#C6F432" stroke-width="2"/>
    <circle cx="1030" cy="130" r="10" fill="#C6F432"/>
    <text x="1030" y="102" class="mono" font-size="14" fill="#C6F432" text-anchor="middle">Nov 2024 → now</text>
    <text x="1030" y="170" class="sans" font-size="17" font-weight="700" fill="#F2F5F9" text-anchor="middle">Louper (UK, remote)</text>
    <text x="1030" y="192" class="mono" font-size="13" fill="#AEB9C8" text-anchor="middle">Product Owner (Full Stack)</text>
    <text x="1030" y="212" class="mono" font-size="13" fill="#AEB9C8" text-anchor="middle">agents · LiveKit · data</text>
  </g>
</svg>

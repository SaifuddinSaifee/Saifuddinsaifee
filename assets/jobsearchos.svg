<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Job Search OS: a job link goes through a fetch ladder, gets matched to real career facts, drafted, reviewed, and sent only after a human approves</title>
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .rung{animation:rung 6s linear infinite}
      @keyframes rung{0%,100%{fill:#141B24}8%,16%{fill:#22301A}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#0B0F14"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="18" fill="none" stroke="#243042"/>
  <text x="40" y="44" class="mono" font-size="15" fill="#6B7A90">// job search os · from a pasted link to a sent email</text>

  <!-- input -->
  <g class="mono" font-size="15">
    <rect x="40" y="150" width="150" height="56" rx="12" fill="#141B24" stroke="#5EE6FF" stroke-width="2"/>
    <text x="115" y="176" text-anchor="middle" fill="#5EE6FF">job link</text>
    <text x="115" y="196" text-anchor="middle" fill="#6B7A90" font-size="13">any posting</text>
  </g>

  <!-- ladder -->
  <g class="mono" font-size="15" fill="#F2F5F9">
    <text x="240" y="84" fill="#6B7A90" font-size="13">FETCH LADDER · cheapest first</text>
    <rect class="rung" style="animation-delay:0s" x="240" y="96" width="250" height="44" rx="8" stroke="#2C3A4E"/>
    <text x="256" y="123">1  ATS APIs ×6</text>
    <rect class="rung" style="animation-delay:.6s" x="240" y="148" width="250" height="44" rx="8" stroke="#2C3A4E"/>
    <text x="256" y="175">2  JSON-LD</text>
    <rect class="rung" style="animation-delay:1.2s" x="240" y="200" width="250" height="44" rx="8" stroke="#2C3A4E"/>
    <text x="256" y="227">3  page text</text>
    <rect class="rung" style="animation-delay:1.8s" x="240" y="252" width="250" height="44" rx="8" stroke="#2C3A4E"/>
    <text x="256" y="279">4  headless Chromium</text>
  </g>

  <!-- stages -->
  <g class="sans" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="540" y="150" width="140" height="56" rx="12" fill="#141B24" stroke="#2C3A4E"/>
    <text x="610" y="184" fill="#F2F5F9">20+ fields</text>
    <rect x="720" y="150" width="140" height="56" rx="12" fill="#141B24" stroke="#B69CFF" stroke-width="2"/>
    <text x="790" y="184" fill="#B69CFF">match facts</text>
    <rect x="900" y="150" width="120" height="56" rx="12" fill="#141B24" stroke="#2C3A4E"/>
    <text x="960" y="184" fill="#F2F5F9">draft</text>
    <rect x="1060" y="150" width="100" height="56" rx="12" fill="#141B24" stroke="#FFC23D" stroke-width="2"/>
    <text x="1110" y="184" fill="#FFC23D">you ✓</text>
  </g>
  <g class="mono" font-size="13" fill="#6B7A90" text-anchor="middle">
    <text x="610" y="232">schema-checked</text>
    <text x="790" y="232">LLM can't invent</text>
    <text x="960" y="232">then judged</text>
    <text x="1110" y="232">then send</text>
  </g>

  <g stroke="#2C3A4E" stroke-width="2" fill="none">
    <path d="M190 178 H240"/><path d="M490 178 H540"/><path d="M680 178 H720"/><path d="M860 178 H900"/><path d="M1020 178 H1060"/>
  </g>

  <!-- packet -->
  <circle r="8" fill="#C6F432">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" path="M190 178 H232 V118 V170 V222 V274 H500 V178 H1060"/>
  </circle>

  <g class="mono" font-size="14" fill="#AEB9C8">
    <text x="540" y="290">pgvector + full-text retrieval · 7 models routed by eval</text>
    <text x="540" y="314">OpenTelemetry trace + cost row on every LLM call · 1,100+ tests</text>
  </g>
</svg>

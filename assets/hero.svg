<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Saifuddin Saifee, product engineer</title>
  <desc id="d">A trace waterfall of how Saif ships: talk to users, write the PRD, build, verify, ship, measure.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B2330" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B0F14" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B0F14" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#C6F432" stop-opacity="0"/>
      <stop offset="1" stop-color="#C6F432" stop-opacity=".35"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .in{opacity:0;animation:in .6s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>

  <rect width="1200" height="440" rx="18" fill="#0B0F14"/>
  <rect width="1200" height="440" rx="18" fill="url(#grid)"/>
  <rect x="560" width="640" height="440" rx="18" fill="url(#fade)" opacity=".0"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="18" fill="none" stroke="#243042"/>

  <!-- window chrome -->
  <g class="mono" font-size="15" fill="#6B7A90">
    <circle cx="32" cy="30" r="6" fill="#FF6B4A"/>
    <circle cx="52" cy="30" r="6" fill="#FFC23D"/>
    <circle cx="72" cy="30" r="6" fill="#C6F432"/>
    <text x="100" y="35">trace · saif.ship()</text>
    <text x="1168" y="35" text-anchor="end"><tspan fill="#C6F432" class="pulse">●</tspan> live · India, remote</text>
  </g>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#243042"/>

  <!-- left: identity -->
  <g class="in" style="animation-delay:.1s">
    <text x="40" y="112" class="mono" font-size="17" fill="#5EE6FF">$ whoami</text>
  </g>
  <g class="in" style="animation-delay:.35s">
    <text x="40" y="172" class="sans" font-size="54" font-weight="800" fill="#F2F5F9" letter-spacing="-1.5">Saifuddin</text>
    <text x="40" y="228" class="sans" font-size="54" font-weight="800" fill="#F2F5F9" letter-spacing="-1.5">Saifee<tspan fill="#C6F432">.</tspan></text>
  </g>
  <g class="in" style="animation-delay:.6s">
    <text x="40" y="272" class="sans" font-size="21" fill="#AEB9C8">Product engineer. I talk to users,</text>
    <text x="40" y="300" class="sans" font-size="21" fill="#AEB9C8">then I ship the fix myself.</text>
  </g>
  <g class="in mono" font-size="15" style="animation-delay:.85s">
    <rect x="40" y="330" width="214" height="34" rx="17" fill="#141B24" stroke="#2C3A4E"/>
    <text x="147" y="352" text-anchor="middle" fill="#F2F5F9">Product Owner @ Louper</text>
    <rect x="264" y="330" width="138" height="34" rx="17" fill="#141B24" stroke="#2C3A4E"/>
    <text x="333" y="352" text-anchor="middle" fill="#F2F5F9">AI agents</text>
    <rect x="412" y="330" width="122" height="34" rx="17" fill="#141B24" stroke="#2C3A4E"/>
    <text x="473" y="352" text-anchor="middle" fill="#F2F5F9">real-time</text>
  </g>
  <g class="in mono" font-size="15" fill="#6B7A90" style="animation-delay:1s">
    <text x="40" y="402">~2.5 yrs · startups only · TypeScript + Python<tspan class="blink" fill="#C6F432"> ▌</tspan></text>
  </g>

  <!-- right: waterfall -->
  <g class="mono" font-size="14">
    <line x1="600" y1="80" x2="600" y2="410" stroke="#243042"/>
    <text x="628" y="96" fill="#6B7A90">SPAN</text>
    <text x="1168" y="96" fill="#6B7A90" text-anchor="end">every feature, roughly</text>
    <line x1="628" y1="108" x2="1168" y2="108" stroke="#1E2836"/>
  </g>

  <!-- scan line -->
  <rect x="628" y="116" width="60" height="282" fill="url(#scan)">
    <animate attributeName="x" values="628;1108;628" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g class="mono" font-size="15">
    <!-- row helper: label at x=628, bar starts at 790 -->
    <text x="628" y="141" fill="#F2F5F9">talk_to_users</text>
    <rect x="790" y="127" height="20" rx="4" fill="#5EE6FF" width="0">
      <animate attributeName="width" from="0" to="120" begin=".4s" dur=".7s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/>
    </rect>

    <text x="628" y="185" fill="#F2F5F9">write_prd</text>
    <rect x="900" y="171" height="20" rx="4" fill="#B69CFF" width="0">
      <animate attributeName="width" from="0" to="70" begin="1s" dur=".6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/>
    </rect>

    <text x="628" y="229" fill="#F2F5F9">build <tspan fill="#6B7A90">w/ claude</tspan></text>
    <rect x="960" y="215" height="20" rx="4" fill="#C6F432" width="0">
      <animate attributeName="width" from="0" to="130" begin="1.5s" dur=".9s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/>
    </rect>

    <text x="628" y="273" fill="#F2F5F9">verify</text>
    <rect x="1040" y="259" height="20" rx="4" fill="#FFC23D" width="0">
      <animate attributeName="width" from="0" to="60" begin="2.3s" dur=".5s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/>
    </rect>

    <text x="628" y="317" fill="#F2F5F9">ship</text>
    <rect x="1090" y="303" height="20" rx="4" fill="#FF6B4A" width="0">
      <animate attributeName="width" from="0" to="24" begin="2.8s" dur=".3s" fill="freeze"/>
    </rect>

    <text x="628" y="361" fill="#F2F5F9">measure → repeat</text>
    <rect x="1104" y="347" height="20" rx="4" fill="#5EE6FF" opacity=".55" width="0">
      <animate attributeName="width" from="0" to="64" begin="3.1s" dur=".6s" fill="freeze"/>
    </rect>
    <text x="628" y="398" fill="#6B7A90" opacity="0">status=ok · users_heard=yes<animate attributeName="opacity" to="1" begin="3.7s" dur=".4s" fill="freeze"/></text>
  </g>
</svg>
